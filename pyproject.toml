[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-closure"
version = "0.1.0"
description = "Versioned monitor-event coverage replay and evidence prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coverage-closure = "coverage_closure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
